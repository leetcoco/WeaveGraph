  <circle cx="100" cy="80" r="4" fill="#000"/>
  <circle cx="100" cy="120" r="4" fill="#000"/>
  <circle cx="100" cy="160" r="4" fill="#000"/>
  <circle cx="100" cy="200" r="4" fill="#000"/>
  <!-- 口袋 -->
  <path class="outline" d="M60,150 L80,150 L80,180 L60,180 Z"/>
  <path class="outline" d="M140,150 L120,150 L120,180 L140,180 Z"/>
</svg>