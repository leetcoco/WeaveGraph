<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <style>
    .outline { fill: none; stroke: #000000; stroke-width: 2; }
  </style>
  <!-- 旗袍主体轮廓 -->
  <path class="outline" d="M50,50 C50,30 80,20 100,20 C120,20 150,30 150,50 L150,250 C150,270 120,280 100,280 C80,280 50,270 50,250 Z"/>
  <!-- 高领 -->
  <path class="outline" d="M90,20 L90,10 C90,5 95,0 100,0 C105,0 110,5 110,10 L110,20"/>
  <!-- 盘扣位置 -->
  <circle cx="100" cy="60" r="3" fill="#000"/>
  <circle cx="100" cy="100" r="3" fill="#000"/>
  <circle cx="100" cy="140" r="3" fill="#000"/>
  <circle cx="100" cy="180" r="3" fill="#000"/>
  <circle cx="100" cy="220" r="3" fill="#000"/>
  <!-- 开衩 -->
  <path class="outline" d="M80,250 L80,270"/>
  <path class="outline" d="M120,250 L120,270"/>
</svg>