<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>中国传统绘画色彩研究</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f8f8f8; }
    h1 { text-align: center; }
    .museum-section { margin-bottom: 40px; }
    .museum-title { font-size: 1.5em; margin: 20px 0 10px; color: #333; border-bottom: 2px solid #aaa; }
    .gallery { display: flex; flex-wrap: wrap; gap: 15px; }
    .painting { width: 200px; background: #fff; padding: 10px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .painting img { width: 100%; height: auto; cursor: pointer; }
    .painting p { margin: 5px 0 0; font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <h1>中国传统绘画色彩研究</h1>

  <div class="museum-section">
    <div class="museum-title">Harvard Museum</div>
    <div class="gallery"></div>
  </div>

  <div class="museum-section">
    <div class="museum-title">Metropolitan Museum</div>
    <div class="gallery"></div>
  </div>

  <div class="museum-section">
    <div class="museum-title">Princeton Museum</div>
    <div class="gallery"></div>
  </div>

  <div class="museum-section">
    <div class="museum-title">Smithsonian Museum</div>
    <div class="gallery"></div>
  </div>

<script>
const museums = ["Harvard/Harvard", "Metropolitan/Metropolitan", "Princeton/Princeton", "Smithsonian/Smithsonian"];
const basePath = "Chinese-Landscape-Painting-Dataset/All-Paintings";

function loadImages(museumFolder, galleryDiv) {
  const folderPath = basePath + "/" + museumFolder;
  let idx = 0;
  for (let i = 0; i < 1500; i++) {
    const name = museumFolder.split('/')[1];
    const exts = [".jpg", ".png"];
    for (const ext of exts) {
      const imgPath = folderPath + "/" + name + "_" + i + ext;
      const img = new Image();
      img.onload = function() {
        const div = document.createElement('div');
        div.className = 'painting';
        div.innerHTML = `<img src="${imgPath}" onclick="showLarge('${imgPath}')"><p>来源：${museumFolder.split('/')[0]} Museum<br>编号:${i}</p>`;
        galleryDiv.appendChild(div);
      };
      img.src = imgPath;
    }
  }
}

document.querySelectorAll('.gallery').forEach((gallery, index) => {
  loadImages(museums[index], gallery);
});

function showLarge(src) {
  window.open(src, '_blank');
}
</script>
</body>
</html>
